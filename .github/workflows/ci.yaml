
name: ci

on: push

jobs:
  build_pipeline:
    name: mlops_pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests_module
       
        run: uv run pytest
      
      - name: Build train dockerimage
        run : docker build -f train.Dockerfile -t train:latest .

      - name: Build inference dockerimage
        run: docker build -f api.Dockerfile -t train:latest .


