services:
  api:
    env_file: ".env"
    build:
      context: .
      dockerfile: api.Dockerfile
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest 

    ports:
      - "3000:3000"
    depends_on:
      - prometheus
