
numeric_cols:
  - subscription_age
  - bill_avg
  # - remaining_contract
  - service_failure_count
  - download_avg
  - upload_avg
  - download_over_limit
  - cost_per_usage
  - num_services_subscribed

binary_cols:
  - is_tv_subscriber
  - is_movie_package_subscriber

target_col: churn

test_size: 0.2
random_state: 42

scaler: standard


models:

  logistic_regression:
    params:
      C:
        low: 0.001
        high: 100
        log: true

      penalty:
        choices:
          - l1
          - l2

  random_forest:
    params:
      n_estimators:
        low: 100
        high: 500

      max_depth:
        low: 3
        high: 30

      min_samples_split:
        low: 2
        high: 20

      min_samples_leaf:
        low: 1
        high: 10

      max_features:
        low: 0.3
        high: 1.0

  xgboost:
    params:
      n_estimators:
        low: 100
        high: 800

      max_depth:
        low: 2
        high: 10

      learning_rate:
        low: 0.01
        high: 0.3
        log: true

      min_child_weight:
        low: 1
        high: 10

      subsample:
        low: 0.6
        high: 1.0

      colsample_bytree:
        low: 0.6
        high: 1.0



cv_folds: 3
n_trials : 40


mlflow_experiment: ISP_Customer_Churn
mlflow_model_name: fault_classifier